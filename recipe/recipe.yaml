schema_version: 1

context:
  name: envelope
  version: "2.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/envelope-${{ version }}.tar.gz
  sha256: 02a29799f39320d7edf249384a255890fa9dff00d64ac6651ab52617cf185202

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - envelope=envelope.__main__:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - python-gnupg >=0.5
    - python-magic
    - email-validator

tests:
  - python:
      imports:
        - envelope
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - envelope --help

about:
  summary: Insert a message and attachments and send e-mail / sign / encrypt contents by a single line.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/CZ-NIC/envelope

extra:
  recipe-maintainers:
    - thewchan
